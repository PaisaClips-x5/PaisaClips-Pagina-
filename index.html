/*

:root {
  --ease: cubic-bezier(.16,1,.3,1);
  --bg: #0b0b0f;
  --gold: #ffc72c;
  --orange: #ff7a1a;
  --ink: #f5f1e6;
  --muted: #a9a395;
  --line: rgba(255,255,255,.12);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100svh;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  contain: strict;
}

.blob {
  position: absolute;
  width: 68vmax;
  height: 68vmax;
  border-radius: 50%;
  opacity: .68;
  filter: blur(9px);
  mix-blend-mode: screen;
  will-change: transform;
}

.b1 {
  top: -24vmax;
  left: -22vmax;
  background:
      radial-gradient(ellipse 42% 36% at 34% 38%,rgba(255,199,44,.62) 0%,rgba(255,199,44,.28) 38%,transparent 76%),
      radial-gradient(ellipse 62% 52% at 62% 58%,rgba(255,174,35,.32) 0%,transparent 74%),
      radial-gradient(ellipse 32% 46% at 72% 28%,rgba(255,224,112,.24) 0%,transparent 72%);
  animation: drift1 16s ease-in-out infinite alternate;
}

.b2 {
  bottom: -25vmax;
  right: -23vmax;
  background:
      radial-gradient(ellipse 46% 38% at 66% 62%,rgba(255,122,26,.58) 0%,rgba(255,122,26,.26) 42%,transparent 76%),
      radial-gradient(ellipse 64% 50% at 38% 42%,rgba(255,164,54,.3) 0%,transparent 74%),
      radial-gradient(ellipse 34% 44% at 28% 72%,rgba(255,203,92,.22) 0%,transparent 70%);
  animation: drift2 19s ease-in-out infinite alternate;
}

@keyframes drift1 {
  to {
    transform: translate3d(8vmax,6vmax,0) scale(1.1);
  }
}

@keyframes drift2 {
  to {
    transform: translate3d(-7vmax,-5vmax,0) scale(1.15);
  }
}

.grid {
  position: absolute;
  inset: 0;
  opacity: .07;
  background-image:
      linear-gradient(var(--ink) 1px,transparent 1px),
      linear-gradient(90deg,var(--ink) 1px,transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(circle at 50% 35%,#000 0,transparent 70%);
  mask-image: radial-gradient(circle at 50% 35%,#000 0,transparent 70%);
}

.spark {
  position: absolute;
  bottom: -10px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 8px 2px rgba(255,199,44,.6);
  opacity: 0;
  animation: rise linear infinite;
  will-change: transform;
}

@keyframes rise {
  0% {
    transform: translate3d(0,0,0) scale(.6);
    opacity: 0;
  }
  10% {
    opacity: .9;
  }
  100% {
    transform: translate3d(0,-105vh,0) scale(1.2);
    opacity: 0;
  }
}

main {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  padding: 48px 20px 16px;
  text-align: center;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo {
  position: relative;
  width: 190px;
  height: 190px;
  margin-bottom: 18px;
  display: grid;
  place-items: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(from 0deg,var(--gold),var(--orange),transparent 40%,var(--gold));
  animation: spin 6s linear infinite;
  -webkit-mask: radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
  mask: radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
}

.glow {
  position: absolute;
  inset: 18px;
  border-radius: 50%;
  background: radial-gradient(circle,rgba(255,199,44,.28),transparent 70%);
  animation: pulse 3s ease-in-out infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes pulse {
  50% {
    transform: scale(1.15);
    opacity: .6;
  }
}

.hat {
  position: relative;
  width: 156px;
  height: auto;
  animation: bob 3.6s ease-in-out infinite;
  transition: transform .6s cubic-bezier(.3,1.6,.5,1);
  user-select: none;
  -webkit-user-drag: none;
}

.hat.tip {
  animation: none;
  transform: rotate(-18deg) translateY(-6px) scale(1.08);
}

@keyframes bob {
  0%,100% {
    transform: translateY(0) rotate(-2deg);
  }
  50% {
    transform: translateY(-8px) rotate(2deg);
  }
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255,255,255,.05);
  font-size: .7rem;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
}

.badge i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 8px var(--gold);
  animation: blink 1.6s infinite;
}

@keyframes blink {
  50% {
    opacity: .25;
  }
}

h1 {
  position: relative;
  font-size: clamp(2.2rem,11vw,3.4rem);
  line-height: .95;
  font-weight: 900;
  letter-spacing: -.02em;
  text-transform: uppercase;
  color: var(--gold);
}

h1::before {
  content: "";
  position: absolute;
  inset: -40% -12%;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(closest-side,rgba(255,199,44,.2),transparent);
  animation: glowIn 1.4s ease .5s backwards;
}

@keyframes glowIn {
  from {
    opacity: 0;
  }
}

.ch {
  display: inline-block;
  opacity: 0;
  transform: translateY(-.7em) rotate(-10deg) scale(.5);
  background: linear-gradient(180deg,var(--ink) 0%,var(--gold) 55%,var(--orange) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: chIn .7s cubic-bezier(.2,.9,.3,1.3) forwards,chWave 3.6s ease-in-out infinite;
  animation-delay: calc(.5s + var(--n) * 80ms),calc(2.2s + var(--n) * 140ms);
}

.ch.sp {
  width: .3em;
}

@keyframes chIn {
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes chWave {
  0%,100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-.09em);
  }
}

.tag {
  margin: 12px 0 30px;
  max-width: 32ch;
  color: var(--muted);
  font-size: clamp(.88rem,3.6vw,1rem);
  line-height: 1.5;
}

.w {
  display: inline-block;
  opacity: 0;
  transform: translateY(10px);
  animation: wIn .6s ease forwards;
  animation-delay: calc(1.3s + var(--n) * 70ms);
}

@keyframes wIn {
  to {
    opacity: 1;
    transform: none;
  }
}

.links {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.link {
  position: relative;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  border: 1px solid var(--line);
  border-radius: 16px;
  text-decoration: none;
  color: var(--ink);
  background: rgba(255,255,255,.05);
  overflow: hidden;
  transition: transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,background .25s,box-shadow .25s;
  -webkit-tap-highlight-color: transparent;
}

.link::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 40%;
  height: 100%;
  background: linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);
  transform: translateX(-150%) skewX(-20deg);
  transition: transform .7s ease;
}

.link:hover,
.link:focus-visible {
  transform: translateY(-3px);
  border-color: rgba(255,199,44,.6);
  background: rgba(255,199,44,.08);
  box-shadow: 0 10px 30px -10px rgba(255,199,44,.35);
  outline: none;
}

.link:hover::after,
.link:focus-visible::after {
  transform: translateX(400%) skewX(-20deg);
}

.link:not(.soon):active {
  transform: scale(.95);
  border-color: var(--gold);
  background: rgba(255,199,44,.14);
  box-shadow: inset 0 3px 14px rgba(0,0,0,.45),0 0 0 4px rgba(255,199,44,.14);
  transition-duration: .08s;
}

.ripple {
  position: absolute;
  width: 20px;
  height: 20px;
  margin: -10px 0 0 -10px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle,rgba(255,199,44,.6),rgba(255,199,44,0) 70%);
  animation: ripple .65s ease-out forwards;
}

@keyframes ripple {
  to {
    transform: scale(14);
    opacity: 0;
  }
}

.num {
  font-size: .75rem;
  letter-spacing: .14em;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}

.name {
  flex: 1;
  text-align: left;
  font-weight: 700;
  font-size: 1.05rem;
}

.go {
  color: var(--muted);
  transition: transform .25s,color .25s;
}

.link:hover .go {
  transform: translateX(4px);
  color: var(--gold);
}

.link.soon {
  opacity: .8;
  cursor: default;
}

.link.soon:hover {
  transform: none;
  border-color: var(--line);
  background: rgba(255,255,255,.05);
  box-shadow: none;
}

.link.soon::after {
  display: none;
}

.soon-tag {
  font-size: .62rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
  border: 1px solid var(--line);
  padding: 3px 8px;
  border-radius: 999px;
}

.stage {
  position: relative;
  z-index: 1;
  margin-top: 34px;
  padding: 14px 0 10px;
  overflow: hidden;
  contain: paint;
  -webkit-mask: linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
  mask: linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
}

.stage::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 1px;
  background: linear-gradient(90deg,transparent,rgba(255,199,44,.5),transparent);
}

.stage::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: radial-gradient(rgba(11,11,15,.85) 38%,transparent 42%);
  background-size: 5px 5px;
  opacity: .5;
}

.row {
  display: flex;
  width: max-content;
  will-change: transform;
  animation: goLeft 26s linear infinite,led 3.2s ease-in-out infinite;
}

.row span {
  white-space: nowrap;
  padding: 0 .5em;
  font-size: clamp(1.1rem,5vw,1.8rem);
  font-weight: 900;
  letter-spacing: .1em;
  line-height: 1.2;
  text-transform: uppercase;
  color: var(--gold);
  text-shadow: 0 0 10px rgba(255,199,44,.6);
}

.row span::after {
  content: "✦";
  color: var(--orange);
  font-size: .6em;
  margin-left: 1em;
  vertical-align: middle;
}

@keyframes goLeft {
  to {
    transform: translate3d(-50%,0,0);
  }
}

@keyframes led {
  0%,100% {
    opacity: 1;
  }
  46% {
    opacity: 1;
  }
  48% {
    opacity: .78;
  }
  50% {
    opacity: 1;
  }
  52% {
    opacity: .86;
  }
  54% {
    opacity: 1;
  }
}

footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 4px 16px calc(20px + env(safe-area-inset-bottom));
  font-size: .72rem;
  letter-spacing: .1em;
  color: var(--muted);
}

@media (max-width: 600px) {
  main {
    width: 100%;
    max-width: 420px;
    padding-top: clamp(22px, 5.8svh, 42px);
    padding-right: max(16px, env(safe-area-inset-right));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-bottom: clamp(12px, 2.8svh, 18px);
  }
  .logo {
    width: clamp(132px, 42vw, 178px);
    height: clamp(132px, 42vw, 178px);
    margin-bottom: clamp(13px, 3.5vw, 18px);
    flex: 0 0 auto;
    touch-action: manipulation;
  }
  .hat {
    width: min(82%, 148px);
    height: auto;
  }
  .badge {
    max-width: 100%;
    gap: 7px;
    padding: 6px 11px;
    font-size: clamp(.62rem, 2.55vw, .7rem);
    letter-spacing: clamp(.1em, 1.7vw, .2em);
    white-space: normal;
  }
  h1 {
    max-width: 100%;
    font-size: clamp(1.85rem, 10.4vw, 3.2rem);
    line-height: .98;
    overflow-wrap: anywhere;
  }
  .tag {
    width: 100%;
    max-width: 32ch;
    margin: 11px 0 clamp(18px, 5.4vw, 28px);
    font-size: clamp(.86rem, 3.5vw, 1rem);
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .links {
    width: 100%;
    gap: clamp(10px, 2.8vw, 12px);
  }
  .link {
    min-height: 54px;
    padding: 14px clamp(13px, 4vw, 20px);
    gap: clamp(11px, 3.4vw, 16px);
    touch-action: manipulation;
  }
  .num {
    flex: 0 0 auto;
    font-size: .72rem;
  }
  .name {
    min-width: 0;
    font-size: clamp(.96rem, 4vw, 1.05rem);
    overflow-wrap: anywhere;
  }
  .soon-tag {
    flex: 0 0 auto;
    font-size: clamp(.55rem, 2.2vw, .62rem);
    letter-spacing: .12em;
    padding: 3px 6px;
  }
  .stage {
    margin-top: clamp(22px, 5.5vw, 34px);
    padding: 12px 0 9px;
  }
  .row span {
    font-size: clamp(1rem, 4.8vw, 1.55rem);
  }
  footer {
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    font-size: clamp(.64rem, 2.65vw, .72rem);
    line-height: 1.6;
    letter-spacing: clamp(.035em, .65vw, .1em);
    overflow-wrap: anywhere;
  }
}

@media (max-width: 360px) {
  main {
    padding-right: max(13px, env(safe-area-inset-right));
    padding-left: max(13px, env(safe-area-inset-left));
  }
  .logo {
    width: clamp(124px, 39vw, 150px);
    height: clamp(124px, 39vw, 150px);
  }
  .badge {
    letter-spacing: .1em;
    padding-inline: 9px;
  }
  .link {
    padding-inline: 12px;
    gap: 10px;
    border-radius: 14px;
  }
  .soon-tag {
    letter-spacing: .08em;
    padding-inline: 5px;
  }
}

@media (max-width: 900px) and (max-height: 500px) and (orientation: landscape) {
  main {
    padding-top: max(12px, env(safe-area-inset-top));
    padding-bottom: 10px;
  }
  .logo {
    width: 118px;
    height: 118px;
    margin-bottom: 10px;
  }
  .hat {
    width: 82%;
  }
  .tag {
    margin-top: 8px;
    margin-bottom: 14px;
  }
  .links {
    max-width: 460px;
  }
  .stage {
    margin-top: 14px;
  }
  footer {
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }
}

.share-button {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 44px;
  margin-top: 14px;
  padding: 10px 15px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255,255,255,.035);
  color: var(--muted);
  font: 600 .82rem/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  letter-spacing: .025em;
  cursor: pointer;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition:
      transform .22s cubic-bezier(.2,.8,.2,1),
      color .22s,
      border-color .22s,
      background .22s,
      box-shadow .22s;
}

.share-button::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg,transparent,rgba(255,199,44,.12),transparent);
  transform: translateX(-130%);
  transition: transform .55s ease;
  pointer-events: none;
}

.share-icon {
  width: 15px;
  height: 15px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform .22s,color .22s;
}

.share-button:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

.share-button:active {
  transform: scale(.96);
  background: rgba(255,199,44,.1);
  border-color: var(--gold);
  transition-duration: .08s;
}

@media (hover:hover) and (pointer:fine) {
  .link:hover {
    transform: translateY(-3px) scale(1.012);
  }
  .link:hover .num {
    text-shadow: 0 0 9px rgba(255,199,44,.55);
  }
  .link:hover .name {
    transform: translateX(2px);
  }
  .name {
    transition: transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .share-button:hover {
    transform: translateY(-2px);
    color: var(--gold);
    border-color: rgba(255,199,44,.5);
    background: rgba(255,199,44,.07);
    box-shadow: 0 7px 22px -12px rgba(255,199,44,.45);
  }
  .share-button:hover::after {
    transform: translateX(130%);
  }
  .share-button:hover .share-icon {
    transform: translateY(-1px);
  }
}

@media (max-width:600px) {
  .share-button {
    margin-top: 12px;
    min-height: 44px;
    padding: 10px 14px;
    font-size: .8rem;
  }
}

/* Contacto */
.contact {
  width: 100%;
  margin-top: 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.contact-label {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  font-size: .62rem;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--muted);
  opacity: .65;
}

.contact-label::before,
.contact-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg,transparent,var(--line));
}

.contact-label::after {
  transform: scaleX(-1);
}

.contact[hidden] {
  display: none;
}

.mail {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  max-width: 100%;
  padding: 6px 18px 6px 6px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255,255,255,.04);
  color: var(--ink);
  text-decoration: none;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,background .25s,box-shadow .25s;
}

.mail::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 40%;
  height: 100%;
  background: linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);
  transform: translateX(-150%) skewX(-20deg);
  transition: transform .7s ease;
  pointer-events: none;
}

.mail:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

.mail:focus-visible::after {
  transform: translateX(400%) skewX(-20deg);
}

.mail:active {
  transform: scale(.95);
  border-color: var(--gold);
  background: rgba(255,199,44,.14);
  box-shadow: inset 0 3px 14px rgba(0,0,0,.45),0 0 0 4px rgba(255,199,44,.14);
  transition-duration: .08s;
}

.mail-ico {
  position: relative;
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--gold);
  background: radial-gradient(circle at 30% 25%,rgba(255,199,44,.22),rgba(255,199,44,.06));
  border: 1px solid rgba(255,199,44,.28);
  animation: mailFloat 3.4s ease-in-out infinite;
}

.mail-svg {
  width: 16px;
  height: 16px;
  overflow: visible;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.mail-svg .flap {
  transform-box: view-box;
  transform-origin: 12px 5px;
  transition: transform .4s cubic-bezier(.3,1.5,.5,1);
}

.mail-dot {
  position: absolute;
  top: 0;
  right: 0;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--orange);
  box-shadow: 0 0 8px var(--orange);
  border: 2px solid var(--bg);
  animation: blink 1.8s infinite;
}

@keyframes mailFloat {

    transform: translateY(0);
  }

    transform: translateY(-3px);
  }
}

.mail-name {

@media (hover:hover) and (pointer:fine) {

@media (max-width:600px) {

.mail-note {

.reveal {
  --rv-y: 34px;
  --rv-s: .975;
}

.reveal.logo {
  --rv-y: 24px;
}

.reveal.badge {
  --rv-y: 16px;
}

.reveal.stage {
  --rv-y: 22px;
  --rv-s: 1;
}

footer.reveal {
  --rv-y: 14px;
  --rv-s: 1;
}

html.js .reveal:not(.is-in) {
  opacity: 0;
  translate: 0 var(--rv-y);
  scale: var(--rv-s);
}

html.js .reveal.is-in {
  animation: sectionIn 1s var(--ease) var(--rv-delay,0ms) both;
}

@keyframes sectionIn {
  from {
    opacity: 0;
    translate: 0 var(--rv-y);
    scale: var(--rv-s);
  }
  to {
    opacity: 1;
    translate: 0 0;
    scale: 1;
  }
}

html.js .reveal.rv-done {
  opacity: 1;
  translate: none;
  scale: none;
  animation: none;
}

html.js .contact:not(.is-in) .contact-label::before,
html.js .contact:not(.is-in) .contact-label::after {
  clip-path: inset(0 0 0 100%);
}

html.js .contact.is-in .contact-label::before,
html.js .contact.is-in .contact-label::after {
  animation: lineDraw 1.2s var(--ease) calc(var(--rv-delay,0ms) + 280ms) backwards;
}

html.js .contact.is-in .mail {
  animation: mailRise 1s var(--ease) calc(var(--rv-delay,0ms) + 220ms) backwards;
}

@keyframes lineDraw {
  from {
    clip-path: inset(0 0 0 100%);
  }
  to {
    clip-path: inset(0 0 0 0);
  }
}

@keyframes mailRise {
  from {
    opacity: 0;
    translate: 0 18px;
  }
}

@property --gx {
  syntax: "<percentage>";
  inherits: false;
  initial-value: 0%;
}

@property --gy {
  syntax: "<percentage>";
  inherits: false;
  initial-value: 0%;
}

.link:not(.soon)::before,
.share-button::before,
.mail::before {
  content: "";
  position: absolute;
  inset: 0;
  padding: 1px;
  border-radius: inherit;
  pointer-events: none;
  --gr: 46px;
  background: radial-gradient(circle var(--gr) at var(--gx) var(--gy),#fff6d0 0,rgba(255,199,44,.95) 22%,rgba(255,150,30,.4) 50%,rgba(255,122,26,0) 72%);
  -webkit-mask: linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite: exclude;
  opacity: .8;
  transition: opacity .35s ease;
  animation: edgeRun var(--gt,9s) linear var(--gd,0s) infinite;
}

.link:not(.soon)::before {
  --gd: calc(var(--i,0) * -2.3s);
}

.share-button::before {
  --gr: 36px;
  --gt: 7s;
  --gd: -3s;
}

.mail::before {
  --gr: 34px;
  --gt: 7.5s;
  --gd: -5.5s;
}

.link:not(.soon):hover::before,
.link:focus-visible::before,
.share-button:hover::before,
.share-button:focus-visible::before,
.mail:hover::before,
.mail:focus-visible::before {
  opacity: 1;
}

@keyframes edgeRun {
  0% {
    --gx: 0%;
    --gy: 0%;
  }
  42% {
    --gx: 100%;
    --gy: 0%;
  }
  50% {
    --gx: 100%;
    --gy: 100%;
  }
  92% {
    --gx: 0%;
    --gy: 100%;
  }
  100% {
    --gx: 0%;
    --gy: 0%;
  }
}

html.no-prop .link::before,
html.no-prop .share-button::before,
html.no-prop .mail::before {
  display: none;
}

.burst {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(100deg,transparent 18%,rgba(255,244,200,.35) 42%,rgba(255,199,44,.7) 50%,rgba(255,244,200,.35) 58%,transparent 82%);
  transform: translateX(-110%) skewX(-18deg);
  animation: burst .42s cubic-bezier(.3,.7,.2,1) forwards;
}

@keyframes burst {
  to {
    transform: translateX(110%) skewX(-18deg);
  }
}

@media (prefers-reduced-motion:reduce) {
  html.js .reveal {
    opacity: 1!important;
    translate: none!important;
    scale: none!important;
    animation: none!important;
  }
  html.js .contact .contact-label::before,
  html.js .contact .contact-label::after,
  html.js .contact .mail {
    clip-path: none!important;
    animation: none!important;
  }
  .link:not(.soon)::before,
  .share-button::before,
  .mail::before {
    animation: none!important;
    --gx: 50%;
    --gy: 0%;
    opacity: .55;
  }
}

html.rv-off .reveal {
  opacity: 1!important;
  translate: none!important;
  scale: none!important;
  animation: none!important;
}

html.rv-off .contact .contact-label::before,
html.rv-off .contact .contact-label::after {
  clip-path: none!important;
}

/* ===== Estética: cristal esmerilado (3) y separadores finos (8) ===== */
:root {
  --glass: linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.012));
  --glass-edge: inset 0 1px 0 rgba(255,255,255,.08);
}

/* 3. Cristal esmerilado en los botones */
.link,
.share-button,
.mail {
  background: var(--glass);
  -webkit-backdrop-filter: blur(9px) saturate(150%);
  backdrop-filter: blur(9px) saturate(150%);
  box-shadow: var(--glass-edge),0 8px 24px -14px rgba(0,0,0,.45);
}

.link:hover,
.link:focus-visible {
  box-shadow: var(--glass-edge),0 10px 30px -10px rgba(255,199,44,.35);
}

.link.soon:hover {
  background: var(--glass);
  box-shadow: var(--glass-edge),0 8px 24px -14px rgba(0,0,0,.6);
}

@media (hover:hover) and (pointer:fine) {
  .share-button:hover {
    box-shadow: var(--glass-edge),0 7px 22px -12px rgba(255,199,44,.45);
  }
  .mail:hover {
    box-shadow: var(--glass-edge),0 10px 30px -10px rgba(255,199,44,.35);
  }
}

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .link,
  .share-button,
  .mail {
    background: rgba(255,255,255,.07);
  }
}

/* 8. Separadores finos dorados que se desvanecen */
.tag {
  margin-bottom: 0;
}

.divider {
  width: 100%;
  height: 1px;
  margin: 20px 0 24px;
  background: linear-gradient(90deg,transparent,rgba(255,199,44,.55),transparent);
  box-shadow: 0 0 12px rgba(255,199,44,.22);
  pointer-events: none;
}

.contact-label::before,
.contact-label::after {
  background: linear-gradient(90deg,transparent,rgba(255,199,44,.5));
}

footer::before {
  content: "";
  display: block;
  width: min(220px,55%);
  height: 1px;
  margin: 0 auto 14px;
  background: linear-gradient(90deg,transparent,rgba(255,199,44,.5),transparent);
}

@media (max-width: 600px) {
  .divider {
    margin: clamp(16px,4.5vw,20px) 0 clamp(18px,5vw,24px);
  }
}

@media (max-width: 900px) and (max-height: 500px) and (orientation: landscape) {
  .divider {
    margin: 10px 0 14px;
  }
}

/* ===== Estética: oro metálico (2), destello en el título (1), polvo de oro fino (6) ===== */
:root {
  --gold-hi: #ffe9a8;
  --gold-lo: #c8901a;
}

/* 2. Oro metálico: solo 3 tonos (champagne, oro, oro viejo) */
.ring {
  background: conic-gradient(from 0deg,var(--gold-lo),var(--gold-hi) 14%,var(--gold) 28%,transparent 42%,var(--gold-lo));
}

.ch {
  background: linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 52%,var(--gold-lo) 100%);
  -webkit-background-clip: text;
  background-clip: text;
}

/* 1. Destello que recorre el título letra por letra cada pocos segundos */
.ch {
  animation: chIn .7s cubic-bezier(.2,.9,.3,1.3) forwards,
             chWave 3.6s ease-in-out infinite,
             chShine 6s ease-in-out infinite;
  animation-delay: calc(.5s + var(--n) * 80ms),
                   calc(2.2s + var(--n) * 140ms),
                   calc(3.2s + var(--n) * 110ms);
}

@keyframes chShine {
  0%,72%,100% {
    filter: none;
  }
  84% {
    filter: brightness(1.55) saturate(.85) drop-shadow(0 0 5px rgba(255,233,168,.75));
  }
}

/* 6. Polvo de oro más fino que titila mientras sube */
.spark {
  background: var(--gold-hi);
  box-shadow: 0 0 5px 1px rgba(255,199,44,.5);
  animation: rise linear infinite,twinkle ease-in-out infinite;
}

@keyframes twinkle {
  0%,100% {
    filter: brightness(.55);
  }
  50% {
    filter: brightness(1.7);
  }
}

@media (prefers-reduced-motion: reduce) {
  .ch {
    animation: chIn .7s cubic-bezier(.2,.9,.3,1.3) forwards,
               chWave 3.6s ease-in-out infinite;
    animation-delay: calc(.5s + var(--n) * 80ms),
                     calc(2.2s + var(--n) * 140ms);
  }
  .spark {
    animation: rise linear infinite;
  }
}

/* ===== Aro del logo: cometa dorado con pista fina (solo transform, ligero) ===== */
.logo::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(255,199,44,.2);
  pointer-events: none;
}

.ring {
  background: none;
  -webkit-mask: none;
  mask: none;
  will-change: transform;
}

.ring::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(from 0deg,
    transparent 0deg 100deg,
    rgba(255,199,44,.38) 176deg,
    transparent 180deg 215deg,
    rgba(200,144,26,.55) 275deg,
    #ffc72c 335deg,
    #ffe9a8 359deg,
    transparent 360deg);
  -webkit-mask: radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
  mask: radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
}

.ring .bead {
  position: absolute;
  top: 2px;
  left: 50%;
  width: 9px;
  height: 9px;
  margin: -4.5px 0 0 -4.5px;
  border-radius: 50%;
  background: #fff4cf;
  box-shadow:
    0 0 3px 1px rgba(255,233,168,.95),
    0 0 10px 3px rgba(255,199,44,.6),
    0 0 22px 6px rgba(255,170,30,.25);
}

@media (prefers-reduced-motion: reduce) {
  .ring {
    animation: none;
  }
}

/* ===== Tipografía de marca: pincel grueso e inclinado, como el logo ===== */
:root {
  --brand: "Knewave","Permanent Marker",Impact,"Arial Black",system-ui,sans-serif;
}

h1 {
  font-family: var(--brand);
  font-weight: 400;
  font-synthesis: none;
  font-size: clamp(1.9rem,9.2vw,2.7rem);
  letter-spacing: .01em;
  line-height: 1.05;
  white-space: nowrap;
}

.ch {
  padding: 0 .02em;
}

.row span {
  font-family: var(--brand);
  font-weight: 400;
  font-synthesis: none;
  font-size: clamp(1rem,4.4vw,1.6rem);
  letter-spacing: .06em;
}

/* ===== Polvo de oro con profundidad: lejano suave, medio fino, cercano nítido ===== */
@keyframes sway {
  from { translate: calc(var(--sw,0px) * -1) 0; }
  to   { translate: var(--sw,0px) 0; }
}

.spark.far {
  background: radial-gradient(circle,rgba(255,220,120,.42) 0%,rgba(255,199,44,.14) 45%,transparent 70%);
  box-shadow: none;
  animation: rise linear infinite,sway ease-in-out infinite alternate;
}

.spark.near {
  background: #fff4cf;
  box-shadow: 0 0 6px 1px rgba(255,233,168,.9),0 0 14px 3px rgba(255,199,44,.45);
  animation: rise linear infinite,twinkle ease-in-out infinite,sway ease-in-out infinite alternate;
}

@media (prefers-reduced-motion: reduce) {
  .spark.far,
  .spark.mid,
  .spark.near {
    animation: rise linear infinite;
  }
}

/* ===== Polvo de oro más realista: bokeh, escamas que brillan, destellos en cruz y bruma ===== */
@keyframes tumble {
  to { rotate: 360deg; }
}

@keyframes glint {
  0%,62%,100% { opacity: 0; scale: .25; rotate: 0deg; }
  78%         { opacity: 1; scale: 1;   rotate: 20deg; }
  92%         { opacity: .25; scale: .55; rotate: 40deg; }
}

.spark.far {
  background: radial-gradient(circle,rgba(255,220,120,.5) 0%,rgba(255,199,44,.16) 45%,transparent 70%);
}

/* Escama de oro: forma irregular, gira y atrapa la luz */
.spark.flake {
  background: linear-gradient(135deg,#fff1c1 0%,#ffc72c 50%,#c8901a 100%);
  box-shadow: none;
  clip-path: polygon(0 35%,35% 0,100% 18%,78% 100%,15% 82%);
  animation: rise linear infinite,twinkle ease-in-out infinite,sway ease-in-out infinite alternate,tumble linear infinite;
}

/* Destello en cruz que aparece y se apaga, como oro bajo una luz */
.glint {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  background:
    radial-gradient(circle,#fff8dc 0,rgba(255,233,168,.85) 14%,transparent 42%),
    linear-gradient(90deg,transparent,rgba(255,233,168,.9),transparent) center / 100% 1.5px no-repeat,
    linear-gradient(0deg,transparent,rgba(255,233,168,.9),transparent) center / 1.5px 100% no-repeat;
  animation: glint ease-in-out infinite;
}

/* Bruma dorada muy tenue, como luz dispersa entre el polvo */
.bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 38% at 50% 100%,rgba(255,199,44,.07),transparent 70%),
    radial-gradient(ellipse 60% 32% at 50% 0%,rgba(255,214,102,.05),transparent 70%);
}

@media (prefers-reduced-motion: reduce) {
  .spark.flake {
    animation: rise linear infinite;
  }
  .glint {
    display: none;
  }
}


/* ===== Pinceladas de oro rotas en las esquinas, como en el banner ===== */
/* El trazo se "dibuja": una máscara con borde difuso avanza siguiendo
   la dirección de las cerdas (de abajo-izquierda hacia arriba-derecha) */
@property --brush-p {
  syntax: '<number>';
  inherits: false;
  initial-value: 1;
}

@keyframes brushIn {
  0%   { --brush-p: 0; opacity: 0; }
  6%   { opacity: .5; }
  100% { --brush-p: 1; opacity: .5; }
}

.brush {
  position: absolute;

    #000 calc(var(--brush-p) * (100% + var(--brush-feather)) - var(--brush-feather)),
    transparent calc(var(--brush-p) * (100% + var(--brush-feather))));
  mask-image: linear-gradient(var(--brush-angle),
    #000 calc(var(--brush-p) * (100% + var(--brush-feather)) - var(--brush-feather)),

.brush.tl {
  top: 0;
  left: 0;
}

.brush.br {
  right: 0;
  bottom: 0;
  transform: rotate(180deg);
  animation-delay: 1s;
}

@media (prefers-reduced-motion: reduce) {
  .brush {
    animation: none;
  }
}

/* ===== Gold flow: cintas de oro en movimiento lento, muy tenues, al fondo ===== */
.flow {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: .42;
  mix-blend-mode: screen;
  pointer-events: none;
  /* se apaga un poco en el centro para no competir con el contenido */
  -webkit-mask-image: radial-gradient(ellipse 62% 56% at 50% 46%, rgba(0,0,0,.4), #000 100%);
  mask-image: radial-gradient(ellipse 62% 56% at 50% 46%, rgba(0,0,0,.4), #000 100%);
}
</style>

<script>
const CONFIG = {
  name: "Paisa Clips",
  badge: "Página oficial",
  tagline: "Siguenos, suscribete y dale Like ",
  ticker: "Paisa Clips",
  footer: "© Paisa Clips · Página oficial",
  contact: "gameoflife1518@gmail.com",
  contactName: "Paisa Clips Business",
  logo: "",
  // icon: opcional. Ruta de un logo propio (ej. "iconos/instagram.svg"). Si queda vacío se usa el ícono genérico.
  links: [
    { label: "Facebook",  sub: "Síguenos",       glyph: "group",  color: "#5b9bff", icon: "facebook-icon.png", url: "https://www.facebook.com/profile.php?id=61596185356334" },
    { label: "Instagram", sub: "@paisaclips.x5", glyph: "camera", color: "#ff5c93", icon: "instagram-icon.png", url: "https://www.instagram.com/paisaclips.x5/" },
    { label: "YouTube",   sub: "Suscríbete",     glyph: "play",   color: "#ff5252", icon: "youtube-icon.png", url: "https://www.youtube.com/channel/UCimemD7PKt2bkGNqzs6f6lw" },
    // TikTok: cuando tengas el perfil, pega el link entre las comillas de url, por ejemplo:
    //   url: "https://www.tiktok.com/@tuusuario"
    // El botón se activa solo y debajo aparece @tuusuario. (Si usas un link corto tipo vm.tiktok.com,
    // escribe el usuario a mano en sub: "@tuusuario".)
    { label: "TikTok",    sub: "Siguenos",               glyph: "link",   color: "#25f4ee", color2: "#fe2c55", icon: "tiktok-icon.png", url: "https://www.tiktok.com/@paisaclipss.x5" }
  ]
};

const $ = id => document.getElementById(id);

(function () {
  const button = $("shareButton");
  const label = $("shareLabel");
  const originalLabel = label.textContent;
  const pageTitle = CONFIG.name + " | " + CONFIG.badge;
  const pageUrl = window.location.href;

  async function copyPageLink() {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(pageUrl);
      } else {
        const field = document.createElement("textarea");
        field.value = pageUrl;
        field.setAttribute("readonly", "");
        field.style.position = "fixed";
        field.style.opacity = "0";
        document.body.appendChild(field);
        field.select();
        const copied = document.execCommand("copy");
        field.remove();
        if (!copied) throw new Error("copy failed");
      }
      label.textContent = "¡Enlace copiado!";
    } catch (_) {
      label.textContent = "Copia el enlace del navegador";
    }
    window.setTimeout(() => { label.textContent = originalLabel; }, 1800);
  }

  button.addEventListener("click", async () => {
    if (navigator.share) {
      try {
        await navigator.share({ title: pageTitle, text: "Visita Paisa Clips", url: pageUrl });
      } catch (error) {
        if (error && error.name !== "AbortError") await copyPageLink();
      }
    } else {
      await copyPageLink();
    }
  });
})();

document.title = CONFIG.name + " | Sitio oficial";
$("badge").textContent = CONFIG.badge;
$("footer").textContent = CONFIG.footer;

if (CONFIG.logo) {
  const img = new Image();
  img.onload = () => { $("hat").src = CONFIG.logo; };
  img.src = CONFIG.logo;
}

(function () {
  const title = $("title");
  title.setAttribute("aria-label", CONFIG.name);
  Array.from(CONFIG.name).forEach((c, i) => {
    const s = document.createElement("span");
    s.className = "ch" + (c === " " ? " sp" : "");
    s.style.setProperty("--n", i);
    s.setAttribute("aria-hidden", "true");
    s.textContent = c === " " ? " " : c;
    title.appendChild(s);
  });

  const tag = $("tag");
  tag.setAttribute("aria-label", CONFIG.tagline);
  CONFIG.tagline.trim().split(/\s+/).forEach((w, i) => {
    const s = document.createElement("span");
    s.className = "w";
    s.style.setProperty("--n", i);
    s.setAttribute("aria-hidden", "true");
    s.textContent = w;
    tag.appendChild(s);
    tag.appendChild(document.createTextNode(" "));
  });
})();

(function () {
  const nav = $("links");
  const GLYPHS = {
    group:  '<circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.4-3 2.6-5 5.5-5s5.1 2 5.5 5"/><circle cx="17" cy="9.5" r="2.4"/><path d="M16 14.2c2.4-.3 4.2 1.4 4.5 4.3"/>',
    camera: '<rect x="3" y="7" width="18" height="12" rx="3"/><path d="M8.5 7 9.7 5h4.6L15.5 7"/><circle cx="12" cy="13" r="3.2"/>',
    play:   '<circle cx="12" cy="12" r="9"/><path d="M10 8.8 16 12l-6 3.2z"/>',
    link:   '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
  };
  // Saca el @usuario del link si lo trae (TikTok, YouTube con @, etc.)
  function userFromUrl(u) {
    const m = /\/(@[A-Za-z0-9._-]+)/.exec(u || "");
    return m ? m[1] : "";
  }
  function rgb(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
    if (!m) return "255,199,44";
    const n = parseInt(m[1], 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(",");
  }
  CONFIG.links.forEach((l, i) => {
    const pending = !l.url || l.url.includes("TU_");
    const el = document.createElement(pending ? "div" : "a");
    el.className = "link reveal" + (pending ? " soon" : "");
    el.style.setProperty("--i", 14 + i);
    if (pending) el.setAttribute("aria-disabled", "true");
    else { el.href = l.url; el.target = "_blank"; el.rel = "noopener noreferrer"; }
    el.innerHTML = '<span class="ico" aria-hidden="true"></span>' +
      '<span class="txt"><span class="name"></span><span class="sub"></span></span>' +
      (pending ? '<span class="soon-tag">Próximamente</span>' : '<span class="go">→</span>');
    el.querySelector(".name").textContent = l.label;
    const subText = l.sub || (pending ? "" : userFromUrl(l.url));
    el.querySelector(".sub").textContent = subText;
    if (!subText) el.querySelector(".sub").remove();
    el.style.setProperty("--cr", rgb(l.color));
    el.style.setProperty("--cr2", rgb(l.color2 || l.color));
    el.style.setProperty("--c", l.color || "var(--gold)");
    const ico = el.querySelector(".ico");
    if (l.icon) {
      const img = new Image();
      img.alt = "";
      img.src = l.icon;
      ico.appendChild(img);
    } else {
      ico.innerHTML = '<svg viewBox="0 0 24 24" focusable="false">' + (GLYPHS[l.glyph] || GLYPHS.link) + '</svg>';
    }
    nav.appendChild(el);
  });

  nav.addEventListener("pointerdown", e => {
    const el = e.target.closest(".link");
    if (!el || el.classList.contains("soon")) return;
    const r = el.getBoundingClientRect();
    const s = document.createElement("span");
    s.className = "ripple";
    s.style.left = (e.clientX - r.left) + "px";
    s.style.top = (e.clientY - r.top) + "px";
    el.appendChild(s);
    s.addEventListener("animationend", () => s.remove());
  });

  nav.addEventListener("click", e => {
    const el = e.target.closest(".link");
    if (!el || el.classList.contains("soon") || !el.animate) return;
    el.animate(
      [{ transform: "scale(.95)" }, { transform: "scale(1.05)", offset: .55 }, { transform: "scale(1)" }],
      { duration: 480, easing: "cubic-bezier(.2,1.4,.4,1)" }
    );
  });
})();

(function () {
  const row = $("ticker");
  const item = "<span>" + CONFIG.ticker + "</span>";
  function fill() {
    row.innerHTML = item;
    const w = row.firstChild.offsetWidth || 240;
    row.innerHTML = item.repeat((Math.ceil(window.innerWidth / w) + 1) * 2);
  }
  let t;
  fill();
  window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(fill, 250); });
})();

(function () {
  const box = $("sparks");
  const r = (a, b) => a + Math.random() * (b - a);
  // Capas con distinta velocidad y forma para que se vea polvo real:
  // bokeh (grande y suave), puntos finos, escamas de oro que giran y brillan,
  // y puntos cercanos nítidos. Aparte, destellos en cruz que aparecen y se apagan.
  const layers = [
    { cls: "far",   n: 9,  size: [12, 26], ratio: 1,        rise: [26, 40],  tw: null,       sway: [14, 28], tumble: null },
    { cls: "mid",   n: 18, size: [1, 2.6], ratio: 1,        rise: [9, 18],   tw: [1.2, 3.4], sway: null,     tumble: null },
    { cls: "flake", n: 10, size: [3, 7],   ratio: [.35,.6], rise: [10, 20],  tw: [.9, 2.2],  sway: [6, 14],  tumble: [3, 7] },
    { cls: "near",  n: 5,  size: [3, 4.5], ratio: 1,        rise: [5.5, 8.5], tw: [1.4, 2.6], sway: [8, 16],  tumble: null }
  ];
  layers.forEach(L => {
    for (let i = 0; i < L.n; i++) {
      const s = document.createElement("span");
      const size = r(L.size[0], L.size[1]);
      const h = size * (Array.isArray(L.ratio) ? r(L.ratio[0], L.ratio[1]) : L.ratio);
      const rise = r(L.rise[0], L.rise[1]);
      const durs = [rise], delays = [-Math.random() * rise];
      const vars = [];
      if (L.tw) { const d = r(L.tw[0], L.tw[1]); durs.push(d); delays.push(-Math.random() * 3); }
      if (L.sway) {
        const d = r(5, 9);
        durs.push(d); delays.push(-Math.random() * d);
        vars.push("--sw:" + r(L.sway[0], L.sway[1]) + "px");
      }
      if (L.tumble) { const d = r(L.tumble[0], L.tumble[1]); durs.push(d); delays.push(-Math.random() * d); }
      s.className = "spark " + L.cls;
      s.style.cssText = "left:" + r(0, 100) + "%;width:" + size + "px;height:" + h + "px;" +
        vars.join(";") + (vars.length ? ";" : "") +
        "animation-duration:" + durs.map(d => d + "s").join(",") + ";" +
        "animation-delay:" + delays.map(d => d + "s").join(",");
      box.appendChild(s);
    }
  });

  for (let i = 0; i < 6; i++) {
    const g = document.createElement("span");
    const size = r(9, 16);
    const d = r(3.5, 7);
    g.className = "glint";
    g.style.cssText = "left:" + r(4, 96) + "%;top:" + r(4, 94) + "%;width:" + size + "px;height:" + size + "px;" +
      "animation-duration:" + d + "s;animation-delay:" + (-Math.random() * d) + "s";
    box.appendChild(g);
  }
})();

(function () {
  const box = $("contact");
  const email = (CONFIG.contact || "").trim();
  if (!email) { box.hidden = true; return; }

  const link = $("mailLink");
  $("mailName").textContent = CONFIG.contactName || "Contacto";
  link.href = "mailto:" + email + "?subject=" + encodeURIComponent("Contacto desde la página de " + CONFIG.name);

  // Ondita dorada al tocar, igual que los botones de las redes
  link.addEventListener("pointerdown", e => {
    const r = link.getBoundingClientRect();
    const s = document.createElement("span");
    s.className = "ripple";
    s.style.left = (e.clientX - r.left) + "px";
    s.style.top = (e.clientY - r.top) + "px";
    link.appendChild(s);
    s.addEventListener("animationend", () => s.remove());
  });

    const note = $("mailNote");
  const subject = "Contacto desde la página de " + CONFIG.name;
  const isDesktop = matchMedia("(hover:hover) and (pointer:fine)").matches &&
                    !/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  let noteTimer;

  function showNote(msg) {
    note.textContent = msg;
    note.classList.add("show");
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => note.classList.remove("show"), 5000);
  }
  async function copyEmail() {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(email);
        return true;
      }
      const f = document.createElement("textarea");
      f.value = email;
      f.setAttribute("readonly", "");
      f.style.position = "fixed";
      f.style.opacity = "0";
      document.body.appendChild(f);
      f.select();
      const ok = document.execCommand("copy");
      f.remove();
      return ok;
    } catch (_) { return false; }
  }
  async function fallback() {
    const ok = await copyEmail();
    showNote(ok ? email + " · copiado" : email);
  }

  link.addEventListener("click", e => {
    e.preventDefault();
    if (isDesktop) {
      // Computador: abre Gmail ya con el destinatario y el asunto
      const url = "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(email) +
                  "&su=" + encodeURIComponent(subject);
      const w = window.open(url, "_blank");
      if (w) { w.opener = null; } else { fallback(); }
      return;
    }
    // Celular: abre la app de correo; si no pasa nada, muestra y copia el correo
    let left = false;
    const mark = () => { left = true; };
    window.addEventListener("blur", mark, { once: true });
    document.addEventListener("visibilitychange", mark, { once: true });
    window.location.href = link.href;
    setTimeout(() => {
      window.removeEventListener("blur", mark);
      document.removeEventListener("visibilitychange", mark);
      if (!left) fallback();
    }, 1500);
  });
})();

(function () {
  const root = document.documentElement;
  const items = Array.from(document.querySelectorAll(".reveal"));
  root.classList.add("rv-ready");

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || !("IntersectionObserver" in window)) {
    items.forEach(el => el.classList.add("is-in", "rv-done"));
    return;
  }

  document.addEventListener("animationend", e => {
    const el = e.target;
    if (e.animationName === "sectionIn" && el.classList && el.classList.contains("reveal")) el.classList.add("rv-done");
  });

  let first = true;
  const io = new IntersectionObserver(entries => {
    const initial = first;
    first = false;
    const seen = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);

    entries.forEach(e => {
      if (!e.isIntersecting && e.boundingClientRect.top < 0) {
        e.target.classList.add("is-in", "rv-done");
        io.unobserve(e.target);
      }
    });

    seen.forEach((e, k) => {
      const el = e.target;
      const i = parseFloat(getComputedStyle(el).getPropertyValue("--i")) || 0;
      el.style.setProperty("--rv-delay", (initial ? i * 110 : k * 90) + "ms");
      el.classList.add("is-in");
      io.unobserve(el);
    });
  }, { threshold: 0.15, rootMargin: "0px 0px -6% 0px" });

  items.forEach(el => io.observe(el));
})();

(function () {
  const nav = $("links");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  nav.addEventListener("click", e => {
    const el = e.target.closest("a.link");
    if (!el || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (el.dataset.go) { e.preventDefault(); return; }
    try { if (navigator.vibrate) navigator.vibrate(14); } catch (_) {}
    if (still) return;
    e.preventDefault();
    el.dataset.go = "1";
    const b = document.createElement("span");
    b.className = "burst";
    el.appendChild(b);
    b.addEventListener("animationend", () => b.remove());
    if (el.animate) {
      el.animate([
        { boxShadow: "0 0 0 0 rgba(255,199,44,0)" },
        { boxShadow: "0 0 0 3px rgba(255,199,44,.55), 0 0 28px 2px rgba(255,199,44,.55)", offset: .35 },
        { boxShadow: "0 0 0 0 rgba(255,199,44,0)" }
      ], { duration: 520, easing: "ease-out" });
    }
    setTimeout(() => {
      delete el.dataset.go;
      const w = window.open(el.href, "_blank");
      if (w) { w.opener = null; } else { window.location.href = el.href; }
    }, 260);
  });
})();
</script>

<script>
/* Gold flow: líneas finas que se tuercen como seda dorada. Ligero: 30 fps, pausa si la pestaña está oculta */
(function () {
  var cv = document.getElementById("goldFlow");
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext("2d");
  var W = 0, H = 0, t = 0, last = 0, raf = 0;
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var TAU = Math.PI * 2;

  var ribbons = [
    { n: 44, k: 70, shift: 0,    wid: 1,    alpha: .26, ph: 0,   sp: 1,    lw: .75 },
    { n: 22, k: 60, shift: .13,  wid: .62,  alpha: .15, ph: 2.1, sp: .8,   lw: .6  }
  ];
  var dust = [];
  for (var d = 0; d < 34; d++) {
    dust.push({ s: Math.random(), o: Math.random() * 2 - 1, v: .004 + Math.random() * .01,
                r: .5 + Math.random() * 1.1, p: Math.random() * TAU });
  }

  function size() {
    W = cv.width = Math.max(1, cv.clientWidth);
    H = cv.height = Math.max(1, cv.clientHeight);
  }

  /* eje de la cinta: de abajo-izquierda a arriba-derecha, con ondulación lenta */
  function cx(s, r) { return -.08 + 1.16 * s + .08 * Math.sin(TAU * .9 * s + 1.2 + r.ph + t * .55 * r.sp); }
  function cy(s, r) { return 1.02 - 1.04 * s + r.shift + .07 * Math.sin(TAU * 1.3 * s + r.ph + t * .42 * r.sp); }
  function half(s, r, base) { return base * r.wid * (.62 + .38 * Math.cos(TAU * s + .6 + r.ph + t * .3)); }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    var base = .17 * (W + H) / 2;

    for (var q = 0; q < ribbons.length; q++) {
      var r = ribbons[q];
      /* eje y normal en cada muestra (se calcula una vez por cinta) */
      var ax = [], ay = [], nx = [], ny = [], hw = [], ph = [], i, j;
      for (j = 0; j <= r.k; j++) {
        var s = j / r.k;
        ax[j] = cx(s, r) * W; ay[j] = cy(s, r) * H;
      }
      for (j = 0; j <= r.k; j++) {
        var a = Math.max(0, j - 1), b = Math.min(r.k, j + 1);
        var tx = ax[b] - ax[a], ty = ay[b] - ay[a], l = Math.hypot(tx, ty) || 1;
        nx[j] = -ty / l; ny[j] = tx / l;
        var s2 = j / r.k;
        hw[j] = half(s2, r, base);
        ph[j] = 3.4 * s2 + .7 * Math.sin(s2 * 5 + t * .6 + r.ph) + t * .35 * r.sp;
      }
      for (i = 0; i < r.n; i++) {
        var f = i / (r.n - 1);
        var spread = f * Math.PI * 1.15;
        /* de oro oscuro (borde) a oro claro (centro) */
        var g = Math.sin(f * Math.PI);
        var R = 200 + 55 * g | 0, G = 144 + 89 * g | 0, B = 26 + 142 * g | 0;
        ctx.strokeStyle = "rgba(" + R + "," + G + "," + B + "," + (r.alpha * (.55 + .45 * g)).toFixed(3) + ")";
        ctx.lineWidth = r.lw;
        ctx.beginPath();
        for (j = 0; j <= r.k; j++) {
          var o = hw[j] * Math.cos(spread + ph[j]);
          var x = ax[j] + nx[j] * o, y = ay[j] + ny[j] * o;
          if (j) ctx.lineTo(x, y); else ctx.moveTo(x, y);
        }
        ctx.stroke();
      }
    }

    /* polvo dorado que viaja con la cinta principal */
    var m = ribbons[0];
    for (var p = 0; p < dust.length; p++) {
      var u = dust[p], s3 = u.s;
      var px = cx(s3, m) * W, py = cy(s3, m) * H;
      var e = Math.min(1, s3 * 20) * Math.min(1, (1 - s3) * 20);
      var dx = cx(Math.min(1, s3 + .01), m) * W - px, dy = cy(Math.min(1, s3 + .01), m) * H - py;
      var dl = Math.hypot(dx, dy) || 1;
      var off = u.o * half(s3, m, base) * 1.5;
      var x2 = px + (-dy / dl) * off, y2 = py + (dx / dl) * off;
      var tw = .5 + .5 * Math.sin(t * 1.6 + u.p);
      ctx.fillStyle = "rgba(255,214,102," + (.55 * tw * e).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(x2, y2, u.r, 0, TAU); ctx.fill();
    }
  }

  function step(now) {
    raf = requestAnimationFrame(step);
    if (now - last < 33) return;            /* ~30 fps */
    var dt = Math.min(.1, (now - last) / 1000 || .033);
    last = now;
    t += dt * .5;
    for (var p = 0; p < dust.length; p++) { dust[p].s += dust[p].v * dt; if (dust[p].s > 1) dust[p].s -= 1; }
    draw();
  }

  function start() { if (!raf && !reduce) raf = requestAnimationFrame(step); }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }

  size();
  if (reduce) { t = 3; draw(); } else { start(); }
  window.addEventListener("resize", function () { size(); if (reduce) draw(); });
  document.addEventListener("visibilitychange", function () { document.hidden ? stop() : start(); });
})();
</script>
