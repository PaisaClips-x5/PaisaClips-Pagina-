<style>
:root{--bg:#0b0b0f;--gold:#ffc72c;--orange:#ff7a1a;--ink:#f5f1e6;--muted:#a9a395;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}

.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:strict}
.blob{position:absolute;width:68vmax;height:68vmax;border-radius:50%;opacity:.68;filter:blur(9px);mix-blend-mode:screen;will-change:transform}
.b1{top:-24vmax;left:-22vmax;background:radial-gradient(ellipse 42% 36% at 34% 38%,rgba(255,199,44,.62) 0%,rgba(255,199,44,.28) 38%,transparent 76%),radial-gradient(ellipse 62% 52% at 62% 58%,rgba(255,174,35,.32) 0%,transparent 74%),radial-gradient(ellipse 32% 46% at 72% 28%,rgba(255,224,112,.24) 0%,transparent 72%);animation:drift1 16s ease-in-out infinite alternate}
.b2{bottom:-25vmax;right:-23vmax;background:radial-gradient(ellipse 46% 38% at 66% 62%,rgba(255,122,26,.58) 0%,rgba(255,122,26,.26) 42%,transparent 76%),radial-gradient(ellipse 64% 50% at 38% 42%,rgba(255,164,54,.3) 0%,transparent 74%),radial-gradient(ellipse 34% 44% at 28% 72%,rgba(255,203,92,.22) 0%,transparent 70%);animation:drift2 19s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(8vmax,6vmax,0) scale(1.1)}}
@keyframes drift2{to{transform:translate3d(-7vmax,-5vmax,0) scale(1.15)}}
.grid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(var(--ink) 1px,transparent 1px),linear-gradient(90deg,var(--ink) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 35%,#000 0,transparent 70%);mask-image:radial-gradient(circle at 50% 35%,#000 0,transparent 70%)}
.spark{position:absolute;bottom:-10px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px 2px rgba(255,199,44,.6);opacity:0;animation:rise linear infinite;will-change:transform}
@keyframes rise{0%{transform:translate3d(0,0,0) scale(.6);opacity:0}10%{opacity:.9}100%{transform:translate3d(0,-105vh,0) scale(1.2);opacity:0}}

main{position:relative;z-index:1;width:100%;max-width:420px;margin:0 auto;padding:48px 20px 16px;text-align:center;flex:1;display:flex;flex-direction:column;align-items:center}
.reveal{animation:up .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 110ms)}
@keyframes up{from{opacity:0;transform:translateY(18px)}}

.logo{position:relative;width:190px;height:190px;margin-bottom:18px;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--gold),var(--orange),transparent 40%,var(--gold));animation:spin 6s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px))}
.glow{position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle,rgba(255,199,44,.28),transparent 70%);animation:pulse 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.6}}
.hat{position:relative;width:156px;height:auto;animation:bob 3.6s ease-in-out infinite;transition:transform .6s cubic-bezier(.3,1.6,.5,1);user-select:none;-webkit-user-drag:none}
.hat.tip{animation:none;transform:rotate(-18deg) translateY(-6px) scale(1.08)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}

.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.05);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}

h1{position:relative;font-size:clamp(2.2rem,11vw,3.4rem);line-height:.95;font-weight:900;letter-spacing:-.02em;text-transform:uppercase;color:var(--gold)}
h1::before{content:"";position:absolute;inset:-40% -12%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(255,199,44,.2),transparent);animation:glowIn 1.4s ease .5s backwards}
@keyframes glowIn{from{opacity:0}}
.ch{display:inline-block;opacity:0;transform:translateY(-.7em) rotate(-10deg) scale(.5);background:linear-gradient(180deg,var(--ink) 0%,var(--gold) 55%,var(--orange) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:chIn .7s cubic-bezier(.2,.9,.3,1.3) forwards,chWave 3.6s ease-in-out infinite;animation-delay:calc(.5s + var(--n) * 80ms),calc(2.2s + var(--n) * 140ms)}
.ch.sp{width:.3em}
@keyframes chIn{to{opacity:1;transform:none}}
@keyframes chWave{0%,100%{transform:translateY(0)}50%{transform:translateY(-.09em)}}

.tag{margin:12px 0 30px;max-width:32ch;color:var(--muted);font-size:clamp(.88rem,3.6vw,1rem);line-height:1.5}
.w{display:inline-block;opacity:0;transform:translateY(10px);animation:wIn .6s ease forwards;animation-delay:calc(1.3s + var(--n) * 70ms)}
@keyframes wIn{to{opacity:1;transform:none}}

.links{width:100%;display:flex;flex-direction:column;gap:12px}
.link{position:relative;display:flex;align-items:center;gap:16px;padding:16px 20px;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.05);overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,background .25s,box-shadow .25s;-webkit-tap-highlight-color:transparent}
.link::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:translateX(-150%) skewX(-20deg);transition:transform .7s ease}
.link:hover,.link:focus-visible{transform:translateY(-3px);border-color:rgba(255,199,44,.6);background:rgba(255,199,44,.08);box-shadow:0 10px 30px -10px rgba(255,199,44,.35);outline:none}
.link:hover::after,.link:focus-visible::after{transform:translateX(400%) skewX(-20deg)}
.link:not(.soon):active{transform:scale(.95);border-color:var(--gold);background:rgba(255,199,44,.14);box-shadow:inset 0 3px 14px rgba(0,0,0,.45),0 0 0 4px rgba(255,199,44,.14);transition-duration:.08s}
.ripple{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,199,44,.6),rgba(255,199,44,0) 70%);animation:ripple .65s ease-out forwards}
@keyframes ripple{to{transform:scale(14);opacity:0}}
.num{font-size:.75rem;letter-spacing:.14em;color:var(--gold);font-variant-numeric:tabular-nums}
.name{flex:1;text-align:left;font-weight:700;font-size:1.05rem}
.go{color:var(--muted);transition:transform .25s,color .25s}
.link:hover .go{transform:translateX(4px);color:var(--gold)}
.link.soon{opacity:.8;cursor:default}
.link.soon:hover{transform:none;border-color:var(--line);background:rgba(255,255,255,.05);box-shadow:none}
.link.soon::after{display:none}
.soon-tag{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:999px}

.stage{position:relative;z-index:1;margin-top:34px;padding:14px 0 10px;overflow:hidden;contain:paint;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.stage::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,199,44,.5),transparent)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(11,11,15,.85) 38%,transparent 42%);background-size:5px 5px;opacity:.5}
.row{display:flex;width:max-content;will-change:transform;animation:goLeft 26s linear infinite,led 3.2s ease-in-out infinite}
.row span{white-space:nowrap;padding:0 .5em;font-size:clamp(1.1rem,5vw,1.8rem);font-weight:900;letter-spacing:.1em;line-height:1.2;text-transform:uppercase;color:var(--gold);text-shadow:0 0 10px rgba(255,199,44,.6)}
.row span::after{content:"✦";color:var(--orange);font-size:.6em;margin-left:1em;vertical-align:middle}
@keyframes goLeft{to{transform:translate3d(-50%,0,0)}}
@keyframes led{0%,100%{opacity:1}46%{opacity:1}48%{opacity:.78}50%{opacity:1}52%{opacity:.86}54%{opacity:1}}

footer{position:relative;z-index:1;text-align:center;padding:4px 16px calc(20px + env(safe-area-inset-bottom));font-size:.72rem;letter-spacing:.1em;color:var(--muted)}

@media (max-width: 600px) {
  main {
    width: 100%;
    max-width: 420px;
    padding-top: clamp(22px, 5.8svh, 42px);
    padding-right: max(16px, env(safe-area-inset-right));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-bottom: clamp(12px, 2.8svh, 18px);
  }

  .logo {
    width: clamp(132px, 42vw, 178px);
    height: clamp(132px, 42vw, 178px);
    margin-bottom: clamp(13px, 3.5vw, 18px);
    flex: 0 0 auto;
    touch-action: manipulation;
  }

  .hat {
    width: min(82%, 148px);
    height: auto;
  }

  .badge {
    max-width: 100%;
    gap: 7px;
    padding: 6px 11px;
    font-size: clamp(.62rem, 2.55vw, .7rem);
    letter-spacing: clamp(.1em, 1.7vw, .2em);
    white-space: normal;
  }

  h1 {
    max-width: 100%;
    font-size: clamp(1.85rem, 10.4vw, 3.2rem);
    line-height: .98;
    overflow-wrap: anywhere;
  }

  .tag {
    width: 100%;
    max-width: 32ch;
    margin: 11px 0 clamp(18px, 5.4vw, 28px);
    font-size: clamp(.86rem, 3.5vw, 1rem);
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  .links {
    width: 100%;
    gap: clamp(10px, 2.8vw, 12px);
  }

  .link {
    min-height: 54px;
    padding: 14px clamp(13px, 4vw, 20px);
    gap: clamp(11px, 3.4vw, 16px);
    touch-action: manipulation;
  }

  .num {
    flex: 0 0 auto;
    font-size: .72rem;
  }

  .name {
    min-width: 0;
    font-size: clamp(.96rem, 4vw, 1.05rem);
    overflow-wrap: anywhere;
  }

  .soon-tag {
    flex: 0 0 auto;
    font-size: clamp(.55rem, 2.2vw, .62rem);
    letter-spacing: .12em;
    padding: 3px 6px;
  }

  .stage {
    margin-top: clamp(22px, 5.5vw, 34px);
    padding: 12px 0 9px;
  }

  .row span {
    font-size: clamp(1rem, 4.8vw, 1.55rem);
  }

  footer {
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    font-size: clamp(.64rem, 2.65vw, .72rem);
    line-height: 1.6;
    letter-spacing: clamp(.035em, .65vw, .1em);
    overflow-wrap: anywhere;
  }
}

@media (max-width: 360px) {
  main {
    padding-right: max(13px, env(safe-area-inset-right));
    padding-left: max(13px, env(safe-area-inset-left));
  }

  .logo {
    width: clamp(124px, 39vw, 150px);
    height: clamp(124px, 39vw, 150px);
  }

  .badge {
    letter-spacing: .1em;
    padding-inline: 9px;
  }

  .link {
    padding-inline: 12px;
    gap: 10px;
    border-radius: 14px;
  }

  .soon-tag {
    letter-spacing: .08em;
    padding-inline: 5px;
  }
}

@media (max-width: 900px) and (max-height: 500px) and (orientation: landscape) {
  main {
    padding-top: max(12px, env(safe-area-inset-top));
    padding-bottom: 10px;
  }

  .logo {
    width: 118px;
    height: 118px;
    margin-bottom: 10px;
  }

  .hat {
    width: 82%;
  }

  .tag {
    margin-top: 8px;
    margin-bottom: 14px;
  }

  .links {
    max-width: 460px;
  }

  .stage {
    margin-top: 14px;
  }

  footer {
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }
}



.share-button{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:44px;margin-top:14px;padding:10px 15px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035);color:var(--muted);font:600 .82rem/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.025em;cursor:pointer;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .22s cubic-bezier(.2,.8,.2,1),color .22s,border-color .22s,background .22s,box-shadow .22s}
.share-button::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent,rgba(255,199,44,.12),transparent);transform:translateX(-130%);transition:transform .55s ease;pointer-events:none}
.share-icon{width:15px;height:15px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .22s,color .22s}
.share-button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.share-button:active{transform:scale(.96);background:rgba(255,199,44,.1);border-color:var(--gold);transition-duration:.08s}
@media (hover:hover) and (pointer:fine){
  .link:hover{transform:translateY(-3px) scale(1.012)}
  .link:hover .num{ text-shadow:0 0 9px rgba(255,199,44,.55)}
  .link:hover .name{transform:translateX(2px)}
  .name{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .share-button:hover{transform:translateY(-2px);color:var(--gold);border-color:rgba(255,199,44,.5);background:rgba(255,199,44,.07);box-shadow:0 7px 22px -12px rgba(255,199,44,.45)}
  .share-button:hover::after{transform:translateX(130%)}
  .share-button:hover .share-icon{transform:translateY(-1px)}
}
@media (max-width:600px){
  .share-button{margin-top:12px;min-height:44px;padding:10px 14px;font-size:.8rem}
}


/* ===== Contacto ===== */
.contact{width:100%;margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:14px}
.contact-label{display:flex;align-items:center;gap:12px;width:100%;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);opacity:.65}
.contact-label::before,.contact-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.contact-label::after{transform:scaleX(-1)}
.contact[hidden]{display:none}

.mail{position:relative;display:inline-flex;align-items:center;gap:10px;max-width:100%;padding:6px 18px 6px 6px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);color:var(--ink);text-decoration:none;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,background .25s,box-shadow .25s}
.mail::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:translateX(-150%) skewX(-20deg);transition:transform .7s ease;pointer-events:none}
.mail:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.mail:focus-visible::after{transform:translateX(400%) skewX(-20deg)}
.mail:active{transform:scale(.95);border-color:var(--gold);background:rgba(255,199,44,.14);box-shadow:inset 0 3px 14px rgba(0,0,0,.45),0 0 0 4px rgba(255,199,44,.14);transition-duration:.08s}

.mail-ico{position:relative;flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--gold);background:radial-gradient(circle at 30% 25%,rgba(255,199,44,.22),rgba(255,199,44,.06));border:1px solid rgba(255,199,44,.28);animation:mailFloat 3.4s ease-in-out infinite}
.mail-svg{width:16px;height:16px;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mail-svg .flap{transform-box:view-box;transform-origin:12px 5px;transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.mail-dot{position:absolute;top:0;right:0;width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 8px var(--orange);border:2px solid var(--bg);animation:blink 1.8s infinite}
@keyframes mailFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.mail-name{font-size:.8rem;font-weight:700;letter-spacing:.03em;white-space:nowrap;transition:color .25s}

@media (hover:hover) and (pointer:fine){
  .mail:hover{transform:translateY(-3px);border-color:rgba(255,199,44,.6);background:rgba(255,199,44,.08);box-shadow:0 10px 30px -10px rgba(255,199,44,.35)}
  .mail:hover::after{transform:translateX(400%) skewX(-20deg)}
  .mail:hover .flap{transform:scaleY(-.55)}
  .mail:hover .mail-name{color:var(--gold)}
}
@media (max-width:600px){
  .contact{margin-top:clamp(22px,6vw,30px);gap:12px}
  .mail{min-height:44px}
  .mail-name{font-size:clamp(.74rem,3.3vw,.8rem)}
}
@media (max-width:900px) and (max-height:500px) and (orientation:landscape){
  .contact{margin-top:16px;gap:10px}
}
.mail-note{min-height:1.1em;margin-top:-6px;font-size:.72rem;letter-spacing:.03em;color:var(--gold);text-align:center;overflow-wrap:anywhere;opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .3s}
.mail-note.show{opacity:.9;transform:none}
@media (prefers-reduced-motion:reduce){
  .mail-ico,.mail-dot{animation:none}
}

/* ===== Botones de redes (con ícono) ===== */
.link{padding:12px 16px;gap:14px}
.ico{position:relative;flex:0 0 auto;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--c,var(--gold));background:linear-gradient(145deg,rgba(var(--cr,255,199,44),.22),rgba(var(--cr2,var(--cr,255,199,44)),.12));border:1px solid rgba(var(--cr,255,199,44),.32);transition:transform .45s cubic-bezier(.3,1.6,.5,1),box-shadow .3s,background .3s}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico img{width:27px;height:27px;object-fit:contain}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.txt .name{flex:none}
.sub{font-size:.74rem;letter-spacing:.04em;color:var(--muted);overflow-wrap:anywhere}
.link:not(.soon):active .ico{transform:scale(.88)}
.link.soon .ico{opacity:1}
.link.soon .name{color:var(--muted)}
@media (hover:hover) and (pointer:fine){
  .link:not(.soon):hover .ico{transform:scale(1.1) rotate(-7deg);box-shadow:-3px -2px 18px -4px rgba(var(--cr,255,199,44),.6),3px 2px 18px -4px rgba(var(--cr2,var(--cr,255,199,44)),.6);background:linear-gradient(145deg,rgba(var(--cr,255,199,44),.34),rgba(var(--cr2,var(--cr,255,199,44)),.18))}
}
@media (max-width:600px){
  .link{min-height:62px;padding:11px clamp(12px,3.6vw,16px);gap:clamp(11px,3.4vw,14px)}
  .ico{width:42px;height:42px;border-radius:13px}
}
@media (max-width:360px){
  .ico{width:38px;height:38px}
  .ico svg{width:20px;height:20px}
}

/* ===== Ecualizador ===== */
.logo{transform:scale(calc(1 + var(--bass,0) * .045));will-change:transform}
.logo::before{content:"";position:absolute;inset:-5px;border-radius:50%;pointer-events:none;opacity:calc(var(--bass,0) * 1.25);box-shadow:0 0 0 1px rgba(255,199,44,.55),0 0 36px 4px rgba(255,199,44,.32)}

.eq{--eqb:0;position:relative;width:100%;margin:-6px 0 20px}
.eq::before{content:"";position:absolute;left:0;right:0;top:0;height:72px;pointer-events:none;background:radial-gradient(ellipse 46% 50% at 50% 50%,rgba(255,199,44,.26),transparent 72%);opacity:var(--eqb)}
.eq canvas{position:relative;display:block;width:100%;height:72px;-webkit-mask:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
@media (max-width:900px) and (max-height:500px) and (orientation:landscape){
  .eq canvas,.eq::before{height:56px}
}
</style>

<script>
//   textos y redes. Usar prefijo TU_USUARIO = proximamente".
const CONFIG = {
  name: "Paisa Clips",
  badge: "Página oficial",
  tagline: "Siguenos, suscribete y dale Like ",
  ticker: "Paisa Clips",
  footer: "© Paisa Clips · Página oficial",
  contact: "gameoflife1518@gmail.com",
  contactName: "Paisa Clips Business",
  logo: "",
  // icon: opcional. Ruta de un logo propio (ej. "iconos/instagram.svg"). Si queda vacío se usa el ícono genérico.
  links: [
    { label: "Facebook",  sub: "Síguenos",       glyph: "group",  color: "#5b9bff", icon: "facebook-icon.png", url: "https://www.facebook.com/profile.php?id=61596185356334" },
    { label: "Instagram", sub: "@paisaclips.x5", glyph: "camera", color: "#ff5c93", icon: "instagram-icon.png", url: "https://www.instagram.com/paisaclips.x5/" },
    { label: "YouTube",   sub: "Suscríbete",     glyph: "play",   color: "#ff5252", icon: "youtube-icon.png", url: "https://www.youtube.com/channel/UCimemD7PKt2bkGNqzs6f6lw" },
    // TikTok: cuando tengas el perfil, pega el link entre las comillas de url, por ejemplo:
    //   url: "https://www.tiktok.com/@tuusuario"
    // El botón se activa solo y debajo aparece @tuusuario. (Si usas un link corto tipo vm.tiktok.com,
    // escribe el usuario a mano en sub: "@tuusuario".)
    { label: "TikTok",    sub: "Siguenos",               glyph: "link",   color: "#25f4ee", color2: "#fe2c55", icon: "tiktok-icon.png", url: "https://www.tiktok.com/@paisaclipss.x5" }
  ]
};

const $ = id => document.getElementById(id);

(function(){
  const button = $("shareButton");
  const label = $("shareLabel");
  const originalLabel = label.textContent;
  const pageTitle = CONFIG.name + " | " + CONFIG.badge;
  const pageUrl = window.location.href;

  async function copyPageLink(){
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(pageUrl);
      } else {
        const field = document.createElement("textarea");
        field.value = pageUrl;
        field.setAttribute("readonly", "");
        field.style.position = "fixed";
        field.style.opacity = "0";
        document.body.appendChild(field);
        field.select();
        const copied = document.execCommand("copy");
        field.remove();
        if (!copied) throw new Error("copy failed");
      }
      label.textContent = "¡Enlace copiado!";
    } catch (_) {
      label.textContent = "Copia el enlace del navegador";
    }
    window.setTimeout(() => { label.textContent = originalLabel; }, 1800);
  }

  button.addEventListener("click", async () => {
    if (navigator.share) {
      try {
        await navigator.share({title: pageTitle, text: "Visita Paisa Clips", url: pageUrl});
      } catch (error) {
        if (error && error.name !== "AbortError") await copyPageLink();
      }
    } else {
      await copyPageLink();
    }
  });
})();


document.title = CONFIG.name + " | Sitio oficial";
$("badge").textContent = CONFIG.badge;
$("footer").textContent = CONFIG.footer;

if (CONFIG.logo) {
  const img = new Image();
  img.onload = () => { $("hat").src = CONFIG.logo; };
  img.src = CONFIG.logo;
}

(function () {
  const title = $("title");
  title.setAttribute("aria-label", CONFIG.name);
  Array.from(CONFIG.name).forEach((c, i) => {
    const s = document.createElement("span");
    s.className = "ch" + (c === " " ? " sp" : "");
    s.style.setProperty("--n", i);
    s.setAttribute("aria-hidden", "true");
    s.textContent = c === " " ? " " : c;
    title.appendChild(s);
  });

  const tag = $("tag");
  tag.setAttribute("aria-label", CONFIG.tagline);
  CONFIG.tagline.trim().split(/\s+/).forEach((w, i) => {
    const s = document.createElement("span");
    s.className = "w";
    s.style.setProperty("--n", i);
    s.setAttribute("aria-hidden", "true");
    s.textContent = w;
    tag.appendChild(s);
    tag.appendChild(document.createTextNode(" "));
  });
})();

(function () {
  const nav = $("links");
  const GLYPHS = {
    group:  '<circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.4-3 2.6-5 5.5-5s5.1 2 5.5 5"/><circle cx="17" cy="9.5" r="2.4"/><path d="M16 14.2c2.4-.3 4.2 1.4 4.5 4.3"/>',
    camera: '<rect x="3" y="7" width="18" height="12" rx="3"/><path d="M8.5 7 9.7 5h4.6L15.5 7"/><circle cx="12" cy="13" r="3.2"/>',
    play:   '<circle cx="12" cy="12" r="9"/><path d="M10 8.8 16 12l-6 3.2z"/>',
    link:   '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
  };
  // Saca el @usuario del link si lo trae (TikTok, YouTube con @, etc.)
  function userFromUrl(u) {
    const m = /\/(@[A-Za-z0-9._-]+)/.exec(u || "");
    return m ? m[1] : "";
  }
  function rgb(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
    if (!m) return "255,199,44";
    const n = parseInt(m[1], 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(",");
  }
  CONFIG.links.forEach((l, i) => {
    const pending = !l.url || l.url.includes("TU_");
    const el = document.createElement(pending ? "div" : "a");
    el.className = "link reveal" + (pending ? " soon" : "");
    el.style.setProperty("--i", 14 + i);
    if (pending) el.setAttribute("aria-disabled", "true");
    else { el.href = l.url; el.target = "_blank"; el.rel = "noopener noreferrer"; }
    el.innerHTML = '<span class="ico" aria-hidden="true"></span>' +
      '<span class="txt"><span class="name"></span><span class="sub"></span></span>' +
      (pending ? '<span class="soon-tag">Próximamente</span>' : '<span class="go">→</span>');
    el.querySelector(".name").textContent = l.label;
    const subText = l.sub || (pending ? "" : userFromUrl(l.url));
    el.querySelector(".sub").textContent = subText;
    if (!subText) el.querySelector(".sub").remove();
    el.style.setProperty("--cr", rgb(l.color));
    el.style.setProperty("--cr2", rgb(l.color2 || l.color));
    el.style.setProperty("--c", l.color || "var(--gold)");
    const ico = el.querySelector(".ico");
    if (l.icon) {
      const img = new Image();
      img.alt = "";
      img.src = l.icon;
      ico.appendChild(img);
    } else {
      ico.innerHTML = '<svg viewBox="0 0 24 24" focusable="false">' + (GLYPHS[l.glyph] || GLYPHS.link) + '</svg>';
    }
    nav.appendChild(el);
  });

  nav.addEventListener("pointerdown", e => {
    const el = e.target.closest(".link");
    if (!el || el.classList.contains("soon")) return;
    const r = el.getBoundingClientRect();
    const s = document.createElement("span");
    s.className = "ripple";
    s.style.left = (e.clientX - r.left) + "px";
    s.style.top = (e.clientY - r.top) + "px";
    el.appendChild(s);
    s.addEventListener("animationend", () => s.remove());
  });

  nav.addEventListener("click", e => {
    const el = e.target.closest(".link");
    if (!el || el.classList.contains("soon") || !el.animate) return;
    el.animate(
      [{ transform: "scale(.95)" }, { transform: "scale(1.05)", offset: .55 }, { transform: "scale(1)" }],
      { duration: 480, easing: "cubic-bezier(.2,1.4,.4,1)" }
    );
  });
})();

(function () {
  const box = $("contact");
  const email = (CONFIG.contact || "").trim();
  if (!email) { box.hidden = true; return; }

  const link = $("mailLink");
  $("mailName").textContent = CONFIG.contactName || "Contacto";
  link.href = "mailto:" + email + "?subject=" + encodeURIComponent("Contacto desde la página de " + CONFIG.name);

  // Ondita dorada al tocar, igual que los botones de las redes
  link.addEventListener("pointerdown", e => {
    const r = link.getBoundingClientRect();
    const s = document.createElement("span");
    s.className = "ripple";
    s.style.left = (e.clientX - r.left) + "px";
    s.style.top = (e.clientY - r.top) + "px";
    link.appendChild(s);
    s.addEventListener("animationend", () => s.remove());
  });

  // --- Qué pasa al tocar: siempre debe hacer algo ---
  const note = $("mailNote");
  const subject = "Contacto desde la página de " + CONFIG.name;
  const isDesktop = matchMedia("(hover:hover) and (pointer:fine)").matches &&
                    !/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  let noteTimer;

  function showNote(msg) {
    note.textContent = msg;
    note.classList.add("show");
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => note.classList.remove("show"), 5000);
  }
  async function copyEmail() {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(email);
        return true;
      }
      const f = document.createElement("textarea");
      f.value = email;
      f.setAttribute("readonly", "");
      f.style.position = "fixed";
      f.style.opacity = "0";
      document.body.appendChild(f);
      f.select();
      const ok = document.execCommand("copy");
      f.remove();
      return ok;
    } catch (_) { return false; }
  }
  async function fallback() {
    const ok = await copyEmail();
    showNote(ok ? email + " · copiado" : email);
  }

  link.addEventListener("click", e => {
    e.preventDefault();
    if (isDesktop) {
      // Computador: abre Gmail ya con el destinatario y el asunto
      const url = "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(email) +
                  "&su=" + encodeURIComponent(subject);
      const w = window.open(url, "_blank");
      if (w) { w.opener = null; } else { fallback(); }
      return;
    }
    // Celular: abre la app de correo; si no pasa nada, muestra y copia el correo
    let left = false;
    const mark = () => { left = true; };
    window.addEventListener("blur", mark, { once: true });
    document.addEventListener("visibilitychange", mark, { once: true });
    window.location.href = link.href;
    setTimeout(() => {
      window.removeEventListener("blur", mark);
      document.removeEventListener("visibilitychange", mark);
      if (!left) fallback();
    }, 1500);
  });
})();

(function () {
  // Canción: EoO de 0:16 a 0:37, incrustada al final del archivo en #eqAudio; se decodifica cuando la página ya cargó.
  const SONG = { start: 0, end: 0, volume: 0.85, fade: 1.4 };

  const root = $("eq"), cv = $("eqCanvas"), logo = $("logo");
  const c = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const AC = window.AudioContext || window.webkitAudioContext;
  const canAnalyse = !!AC;
  const audio = new Audio();
  audio.preload = "auto";
  audio.setAttribute("playsinline", "");
  let loaded = false;
  function loadSong() {
    if (loaded) return;
    const el = $("eqAudio");
    if (!el) throw new Error("audio");
    loaded = true;
    const raw = atob(el.textContent.trim());
    const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    el.textContent = "";
    audio.src = URL.createObjectURL(new Blob([arr], { type: "audio/mpeg" }));
  }
  addEventListener("load", () => {
    const go = () => { try { loadSong(); } catch (_) { return; } tryAuto(); };
    if (window.requestIdleCallback) requestIdleCallback(go, { timeout: 2000 });
    else setTimeout(go, 300);
  });
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (_) {}

  let state = "waiting", want = false, resumeOnShow = false;
  let ctx = null, analyser = null, gain = null, bins = null;
  let vol = 0, tgt = 0;

  function setState(s) {
    state = s;
    root.dataset.state = s;
  }
  function setVol(v) {
    if (gain) gain.gain.value = v;
    else audio.volume = Math.min(1, Math.max(0, v));
  }

  function graph() {
    if (!canAnalyse || ctx) return;
    try {
      ctx = new AC();
      const src = ctx.createMediaElementSource(audio);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.6;
      gain = ctx.createGain();
      gain.gain.value = 0;
      src.connect(analyser);
      src.connect(gain);
      gain.connect(ctx.destination);
      bins = new Uint8Array(analyser.frequencyBinCount);
      layout();
    } catch (_) { ctx = analyser = gain = bins = null; }
  }

  async function play() {
    loadSong();
    graph();
    if (audio.currentTime < SONG.start) audio.currentTime = SONG.start;
    want = true;
    try {
      await Promise.all([ctx ? ctx.resume() : 0, audio.play()]);
      tgt = SONG.volume;
      disarm();
      setState("playing");
    } catch (e) {
      want = false;
      audio.pause();
      throw e;
    }
  }
  const EVENTS = ["pointerup", "touchend", "keydown", "click"];
  function onGesture(e) {
    disarm();
    play().catch(fail);
  }
  function arm() { EVENTS.forEach(ev => addEventListener(ev, onGesture, true)); }
  function disarm() { EVENTS.forEach(ev => removeEventListener(ev, onGesture, true)); }
  function fail() {
    if (audio.error) { setState("error"); return; }
    setState("waiting");
    arm();
  }

  audio.addEventListener("error", () => { want = false; disarm(); setState("error"); });
  audio.addEventListener("ended", () => {
    if (!want) return;
    audio.currentTime = SONG.start;
    vol = 0;
    audio.play().catch(() => {});
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (state === "playing" && !audio.paused) { resumeOnShow = true; audio.pause(); }
    } else if (resumeOnShow) {
      resumeOnShow = false;
      vol = 0;
      if (ctx) ctx.resume();
      audio.play().catch(() => { want = false; setState("paused"); });
    }
  });

  // ----- Ecualizador -----
  let W = 0, H = 0, M = 0, lo = [], hi = [], lvl = new Float32Array(0), peak = new Float32Array(0), base = null;
  let last = 0, kick = 0, prevKick = 0, bm = 0, shown = -1, silent = 0, lastPulse = 0, onScreen = true;
  const pulses = [];

  function layout() {
    if (!W) return;
    M = Math.max(12, Math.round(W / 14));
    lvl = new Float32Array(M);
    peak = new Float32Array(M);
    lo = []; hi = [];
    const bw = (ctx ? ctx.sampleRate : 44100) / 2048, top = 1023, fmin = 45, fmax = 12000;
    for (let i = 0; i < M; i++) {
      const f0 = fmin * Math.pow(fmax / fmin, i / M), f1 = fmin * Math.pow(fmax / fmin, (i + 1) / M);
      const a = Math.min(top, Math.max(1, Math.floor(f0 / bw)));
      lo.push(a);
      hi.push(Math.min(top, Math.max(a, Math.ceil(f1 / bw) - 1)));
    }
    base = c.createLinearGradient(0, 0, W, 0);
    base.addColorStop(0, "rgba(255,199,44,0)");
    base.addColorStop(0.5, "rgba(255,199,44,1)");
    base.addColorStop(1, "rgba(255,199,44,0)");
  }
  function resize() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
  }
  if ("ResizeObserver" in window) new ResizeObserver(resize).observe(cv);
  else addEventListener("resize", resize);
  if ("IntersectionObserver" in window) new IntersectionObserver(en => { onScreen = en[0].isIntersecting; }).observe(cv);
  resize();

  // Espectro simulado: se usa si el navegador no deja analizar el audio (por ejemplo abriendo el archivo directo con file://)
  function simBar(i, t) {
    const k = Math.exp(-((t * 1.65) % 1) * 5.5), x = i / M;
    return Math.min(1, 0.1 + 0.62 * k * Math.max(0, 1 - x * 2.2) +
      0.3 * (1 - x * 0.6) * (0.5 + 0.5 * Math.sin(t * 3.1 + i * 0.9) * Math.sin(t * 1.9 - i * 0.37)));
  }

  function draw() {
    const cy = H / 2, step = W / (2 * M), amp = cy - 10, mid = W / 2;
    c.clearRect(0, 0, W, H);

    c.globalAlpha = 0.14 + kick * 0.5;
    c.fillStyle = base;
    c.fillRect(0, cy - 0.5, W, 1);
    c.globalAlpha = 1;

    c.lineWidth = 1;
    for (let k = 0; k < pulses.length; k++) {
      const p = pulses[k];
      c.strokeStyle = "rgba(255,199,44," + ((1 - p) * (1 - p) * 0.35).toFixed(3) + ")";
      c.beginPath();
      c.ellipse(mid, cy, 12 + p * W * 0.48, 3 + p * amp, 0, 0, 6.2832);
      c.stroke();
    }

    c.lineCap = "round";
    c.lineWidth = W < 300 ? 2.5 : 3;
    for (let i = 0; i < M; i++) {
      const v = lvl[i], hh = 1.5 + v * amp, t = i / M, x = (i + 0.5) * step;
      c.strokeStyle = "rgba(255," + Math.round(199 - t * 70) + "," + Math.round(44 - t * 20) + "," + (0.4 + Math.min(1, v * 1.5) * 0.6).toFixed(2) + ")";
      c.beginPath();
      c.moveTo(mid - x, cy - hh); c.lineTo(mid - x, cy + hh);
      c.moveTo(mid + x, cy - hh); c.lineTo(mid + x, cy + hh);
      c.stroke();
    }

    c.fillStyle = "rgba(255,236,170,.75)";
    c.beginPath();
    for (let i = 0; i < M; i++) {
      if (peak[i] - lvl[i] < 0.03) continue;
      const x = (i + 0.5) * step, ph = 6.5 + peak[i] * amp;
      for (let sx = -1; sx <= 1; sx += 2) for (let sy = -1; sy <= 1; sy += 2) {
        c.moveTo(mid + sx * x + 1.4, cy + sy * ph);
        c.arc(mid + sx * x, cy + sy * ph, 1.4, 0, 6.2832);
      }
    }
    c.fill();
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (ts - last) / 1000) || 0.016;
    last = ts;

    // Volumen, fades y bucle de la parte elegida
    const e = SONG.end || audio.duration || 0;
    const f = e ? Math.max(0.3, Math.min(SONG.fade, (e - SONG.start) / 3)) : SONG.fade;
    if (want && !audio.paused && e) {
      const t = audio.currentTime;
      if (t >= e - 0.04) { audio.currentTime = SONG.start; vol = 0; }
      tgt = e - t <= f ? 0 : SONG.volume;
    }
    const st = dt * SONG.volume / f;
    vol = vol < tgt ? Math.min(tgt, vol + st) : Math.max(tgt, vol - st * (want ? 1 : 3));
    setVol(vol);
    if (!want && !audio.paused && vol < 0.003) audio.pause();

    // Lectura del audio
    const live = want && !audio.paused && vol > 0.02;
    let useSim = false, braw = 0;
    if (live) {
      let sum = 0;
      if (analyser) {
        analyser.getByteFrequencyData(bins);
        for (let b = 1; b < 90; b++) sum += bins[b];
      }
      silent = analyser && sum === 0 && vol > 0.3 ? silent + 1 : 0;
      useSim = !analyser || silent > 120;
      if (useSim) braw = Math.exp(-((audio.currentTime * 1.65) % 1) * 5.5) * 0.9;
      else {
        let s = 0;
        for (let b = 2; b <= 10; b++) s += bins[b];
        braw = Math.pow(s / 9 / 255, 1.6);
      }
      bm += (braw - bm) * Math.min(1, dt * 1.2);
      const kt = Math.min(1, Math.max(0, (braw - bm) * 3.2 + braw * 0.3));
      kick += (kt - kick) * (kt > kick ? 0.75 : Math.min(1, dt * 7));
    } else {
      kick += (0 - kick) * Math.min(1, dt * 6);
    }

    if (!reduce && live && kick > 0.6 && prevKick <= 0.6 && ts - lastPulse > 260) {
      pulses.push(0);
      if (pulses.length > 3) pulses.shift();
      lastPulse = ts;
    }
    prevKick = kick;
    for (let k = pulses.length - 1; k >= 0; k--) {
      pulses[k] += dt * 1.15;
      if (pulses[k] >= 1) pulses.splice(k, 1);
    }

    if (Math.abs(kick - shown) > 0.01) {
      shown = kick;
      const s = kick.toFixed(3);
      root.style.setProperty("--eqb", s);
      if (!reduce) logo.style.setProperty("--bass", s);
    }

    // Barras: el centro son los bajos, hacia los lados van los agudos
    const ak = 1 - Math.exp(-dt * 45), rk = 1 - Math.exp(-dt * 9);
    const idle = reduce ? 0 : state === "waiting" ? 1.6 : 0.8;
    for (let i = 0; i < M; i++) {
      let v;
      if (live) {
        if (useSim) v = simBar(i, audio.currentTime);
        else {
          let mx = 0, sm = 0;
          for (let b = lo[i]; b <= hi[i]; b++) { const x = bins[b]; if (x > mx) mx = x; sm += x; }
          v = (mx * 0.65 + (sm / (hi[i] - lo[i] + 1)) * 0.35) / 255;
          v = Math.min(1, Math.pow(v, 1.55) * (1 + (i / M) * 0.55));
        }
      } else {
        v = 0.04 + idle * 0.07 * Math.max(0, Math.sin(ts * 0.003 - i * 0.45));
      }
      lvl[i] += (v - lvl[i]) * (v > lvl[i] ? ak : rk);
      peak[i] = Math.max(lvl[i], peak[i] - dt * 0.6);
    }

    if (onScreen && W) draw();
  }

  setVol(0);
  setState("waiting");
  requestAnimationFrame(frame);

  function tryAuto() {
    Promise.race([play(), new Promise((_, no) => setTimeout(no, 1500))]).catch(fail);
  }
  arm();
})();
